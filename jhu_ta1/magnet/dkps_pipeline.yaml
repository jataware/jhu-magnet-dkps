__doc__: |
  DKPS instance prediction: one fit per seed.

      dkps_auc[seed]

  Runs under kwdagger on its own:

      python -m kwdagger.schedule \
          --pipeline jhu_ta1/magnet/dkps_pipeline.yaml \
          --root_dpath ./runs \
          --params "
              matrix:
                dkps_auc.seed: [1, 2, 3]
                materialize_lite.precomputed_roots: /data/crfm-helm-public
          " --run=1

  jhu_instance_predict_auc_kwdagger.yaml points at this file and adds the
  claim.

nodes:
  # Acquisition is part of the pipeline (goal.md 5.7): the suite the scorer
  # reads is produced by this node, symlinked out of a precomputed root when
  # one holds it (`precomputed_roots`, a perf param: where the bytes come
  # from is not part of the suite's identity) and downloaded from the public
  # bucket otherwise. The scorer's helm_suite_path is then a produced path,
  # hashed relative to the run root, so the same card has the same identity
  # on every machine.
  materialize_lite:
    class: magnet.process_node.MagnetProcessNode
    executable: 'python -m magnet.backends.helm.cli.materialize_helm_suite'
    algo_params:
      benchmark: lite
      version: v1.0.0
      runs: 'regex:med_qa.*'
    perf_params:
      precomputed_roots: ''
      download: auto
    out_paths:
      suite_dpath: benchmark_output/runs/v1.0.0
      # The manifest is primary: kwdagger's generic loader parses the primary
      # output as JSON when it walks predecessors, and a bare DONE breaks it.
      manifest_fpath: materialize_manifest.json
      done_fpath: DONE
    primary_out_key: manifest_fpath
  dkps_auc:
    # Containerization is opt-in per node class. A plain YAML node ignores
    # --container_image, and MAGNET refuses such a run rather than report a
    # host result as a containerized one. This class is inert without an
    # image, so the host route is unchanged.
    class: magnet.process_node.MagnetProcessNode
    executable: 'python -m jhu_ta1.magnet.dkps_auc'
    out_paths:
      out_fpath: 'dkps_auc.json'
    primary_out_key: out_fpath
    in_paths: [helm_suite_path]
    algo_params:
      dataset: med_qa
      metric: exact_match
      n_components_cmds: 8
      num_embedding_queries: 50
      num_eval_samples: 75
      # Cannot exceed the med_qa runs the suite holds. HELM lite v1.0.0 has 31,
      # and asking for more raises "Sample larger than population".
      num_example_runs: 25
      seed: 1

edges:
  - materialize_lite.suite_dpath -> dkps_auc.helm_suite_path
