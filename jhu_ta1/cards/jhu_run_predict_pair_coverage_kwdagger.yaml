name: jhu_run_predict_pair_coverage
title: 'DKPS: lower expected error for over 95% of dataset–model–budget combinations'
description: |
  CLAIM
    For more than 95% of (dataset, model, query budget) combinations, DKPS has lower
    expected absolute score-estimation error than the same-budget sample mean.

  EVALUATION
    1. Select datasets from a HELM suite, a common set of target models,
       and query budgets before evaluating outcomes.
    2. For each (dataset, target model, query budget m), repeatedly draw
       random samples of m queries.
    3. For each sample, embed responses and fit DKPS using reference models
       and their benchmark scores, excluding the target's provider family.
       Estimate the target's score as a weighted average of the sample mean
       and the raw DKPS prediction.
    4. Compare DKPS and the same-query sample mean with the target's
       full-pool benchmark score. Record each estimate's absolute error.
    5. Average each method's absolute errors over the repeated samples,
       separately for each (dataset, target model, query budget).
    6. Count combinations where DKPS has strictly lower average error.
       The claim passes if these exceed 95% of all evaluated combinations.

