title: 'DKPS run-level prediction: 2x query efficiency (MAE in expectation)'

description: |
  CLAIM
    Informally: On most datasets, given a sufficient number of training models,
    DKPS predicts a model's benchmark score at least as accurately from 4 queries 
    as the naive sample mean does from 8.
  
    Formally: Let D be the set of evaluation datasets. For each dataset d, run
    N = 32 Monte-Carlo replicates. Replicate r draws a random target model
    (target_models), random training models (train_models) and random query samples, 
    then computes the absolute prediction error of each estimator:
  
        err_dkps[d][r]   = abs( DKPS_predict(target_models, train_models, queries=4) - true_score(target_models) )
        err_sample[d][r] = abs( sample_mean(target_models,  queries=8) - true_score(target_models) )
  
    The per-dataset MAE is the average of those N per-replicate errors:
  
        MAE_dkps(d)   = (1/N) * sum over r of  err_dkps[d][r]
        MAE_sample(d) = (1/N) * sum over r of  err_sample[d][r]
  
    The claim is:
        For at least 80% of d in D : MAE_dkps(d) <= MAE_sample(d)

