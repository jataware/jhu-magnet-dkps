[build-system]
requires = ["setuptools >= 80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
namespaces = true
include = ["jhu_ta1*"]

[tool.setuptools.package-data]
jhu_ta1 = ["cards/*.yaml"]

[tool.setuptools.dynamic]
version = {attr = "jhu_ta1.__version__"}

[project.entry-points."helm.run_specs"]
run_specs = "jhu_ta1.backends.helm.run_specs"

[project]
name = "jhu_ta1"
dynamic = ["version"]
description = "Example TA1 algorithm implementation for MAGNET"
readme = "README.md"
authors = [
    {name = "MAGNET Kitware", email = "aiq-ta2@kitware.com"}
]
urls = { "Repository" = "https://github.com/AIQ-Kitware/aiq-magnet/" }
requires-python = ">=3.11"
dependencies = [
    # From PyPI. 0.1.0 is the first release with the kwdagger execution API
    # (magnet.process_node) and the materialize CLI the pipelines use; the
    # [optional] extra brings the HELM loaders and download utility.
    "aiq-magnet[optional]>=0.1.0",
    # Add your other Python dependencies here
    "dkps @ git+https://github.com/jataware/dkps@magnet",
    "httpx>=0.28.1,<0.29",
    # Local embedding for text-embedding datasets (e.g. math via
    # nomic-embed-text-v2-moe). einops is required by the nomic MoE custom
    # code loaded under trust_remote_code=True.
    "sentence-transformers>=3.1",
    "einops>=0.8",
]

[tool.uv.sources]
aiq-magnet = { path = "../aiq-magnet", editable = true }
