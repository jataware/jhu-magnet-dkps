# Theorem index: DKPS formalization (JHU), pin 144de76c.
#
# Converted from the legacy index schema by theory/convert_index.py; the prior
# version is in git history, including its per-theorem commentary.
#
# The pin is 22 commits behind the checked-out submodule (0ef9e8d5), but the
# four declaration-bearing files are untouched across that range, so the index
# is still accurate at HEAD. `axioms` and `review` from the legacy schema are
# folded into each entry's statement under PROVENANCE -- the new schema has no
# field for them, and dropping them silently would lose the one column that
# says whether the kernel actually checked the proof.
#
# The load-bearing finding, preserved here because it is easy to lose: the
# query-efficiency theorem now proves the result for a fitted OLS, so the card's
# estimator binds it faithfully -- at the cost of two premises (`hcompetitive`,
# `hgap`) stated in terms of the TRUE embedding, which the experiment never
# computes. The gap is no longer "the theorem is about something else" but "the
# theorem's non-vacuity condition is unobservable in principle".

schema_version: 1
